name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Migration Guard
        run: npm run check:migrations

      - name: Lint
        run: npm run lint

      - name: Run tests (CI mode)
        run: npm run test -- --ci --coverage

      - name: Production deploy-guard CLI contract tests (isolated local Postgres)
        # Spins up a throwaway, in-process Postgres (embedded-postgres) to
        # exercise scripts/production/db-probe.ts,
        # scripts/production/postflight-catalog.ts, and
        # scripts/production/db-reconcile-readonly.ts as real child
        # processes. Never touches DATABASE_URL, a hosted Supabase project,
        # or production — the instance is created and destroyed within this
        # step and never leaves the runner. See
        # docs/PRODUCTION_MIGRATION_WORKFLOW.md.
        run: npm run test:production-guards-integration

      - name: update_instrument_sale_transition_atomic migration consolidation tests (isolated local Postgres)
        # Spins up a throwaway, in-process Postgres (embedded-postgres) to
        # prove supabase/migrations/20260423140001_update_instrument_sale_transition_atomic_consolidated.sql
        # converges safely from every reachable starting catalog state and
        # that a failure inside it cannot leave a partially-applied state.
        # Never touches DATABASE_URL, a hosted Supabase project, or
        # production — the instance is created and destroyed within this
        # step and never leaves the runner.
        run: npm run test:sale-transition-migration-consolidation

      - name: Interested/Booked relationship uniqueness migration tests (isolated local Postgres)
        # Spins up a throwaway, in-process Postgres (embedded-postgres) to
        # prove supabase/migrations/20260815120000_enforce_unique_interested_booked_connections.sql
        # against the current tracked migration chain: clean apply, fail-closed
        # duplicate preflight, concurrent unique rejection, and neighboring
        # Owned/Sold contracts. Never touches DATABASE_URL, a hosted Supabase
        # project, or production — the instance is created and destroyed
        # within this step and never leaves the runner.
        run: npm run test:connection-relationship-uniqueness-migration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      # Production database deployment (supabase db push, schema readiness)
      # intentionally does not run here. See
      # .github/workflows/production-db-deploy.yml for the separately
      # invoked, approval-gated production migration workflow.

      - name: Build application
        run: npm run build

      - name: Verify middleware registration
        run: npm run check:middleware-manifest

      - name: Verify middleware redirects (built server)
        run: npm run test:middleware-routing
        env:
          RATE_LIMITING_DISABLED: 'true'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: build-files
          path: .next/
          retention-days: 1

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    env:
      PLAYWRIGHT_SUITE: critical
      PLAYWRIGHT_WEB_SERVER: production
      PLAYWRIGHT_SKIP_BUILD: 'true'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      RATE_LIMITING_DISABLED: 'true'
      STORAGE_TYPE: s3
      S3_BUCKET_NAME: e2e-ci-placeholder
      S3_REGION: us-east-1
      # Dedicated test/staging project only. Do not reuse the production
      # NEXT_PUBLIC_SUPABASE_* / SUPABASE_SERVICE_ROLE_KEY repo secrets —
      # production-db-deploy.yml still consumes those.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_TEST_MEMBER_EMAIL: ${{ secrets.E2E_TEST_MEMBER_EMAIL }}
      E2E_TEST_MEMBER_PASSWORD: ${{ secrets.E2E_TEST_MEMBER_PASSWORD }}
      E2E_TEST_ORG_ID: ${{ secrets.E2E_TEST_ORG_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      - name: Require E2E test environment
        run: |
          missing=()
          for name in \
            NEXT_PUBLIC_SUPABASE_URL \
            NEXT_PUBLIC_SUPABASE_ANON_KEY \
            SUPABASE_SERVICE_ROLE_KEY
          do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required E2E secrets: ${missing[*]}"
            echo "Set repository secrets STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY, and STAGING_SUPABASE_SERVICE_ROLE_KEY on a dedicated test/staging project. Do not use production credentials."
            exit 1
          fi
          if [ -n "${PRODUCTION_SUPABASE_PROJECT_REF:-}" ]; then
            case "${NEXT_PUBLIC_SUPABASE_URL}" in
              *"${PRODUCTION_SUPABASE_PROJECT_REF}"*)
                echo "E2E Tests must not use the production Supabase project."
                exit 1
                ;;
            esac
          fi
          echo "Required E2E environment variables are present."

      - name: Assert critical suite is non-empty
        run: node scripts/assert-critical-e2e-selected.cjs

      - name: Install Playwright Chromium
        run: npm run test:e2e:install:chromium

      - name: Build production application
        run: npm run build

      - name: Run critical-path E2E tests
        run: npm run test:e2e:critical

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

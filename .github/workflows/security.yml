name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Setup npm
        run: npm install --global npm@11.7.0

      - name: Install dependencies
        run: npm ci

      # Production dependency: blocking. Dev-tooling CVEs must not fail every PR.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Full dependency tree: visible but temporarily non-blocking while
      # Jest/ESLint transitive baselines are cleaned up in a follow-up PR.
      - name: Audit full dependency tree
        continue-on-error: true
        run: npm audit --audit-level=high

      # Always execute Snyk, even if an earlier audit fails.
      # Pin to snyk/actions v1.0.0 full commit SHA (not floating @master).
      - name: Run Snyk to check for vulnerabilities
        if: always()
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

name: Hosted Staging Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/staging/**'
      - 'scripts/auth-matrix/**'
      - 'scripts/postdeploy/**'
      - 'tests/integration/auth-matrix/**'
      - 'tests/integration/staging/**'
      - '.github/workflows/hosted-staging-integration.yml'

concurrency:
  group: hosted-staging-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    if: github.repository == 'mjaychoi/HC-Violins-and-Bows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Staging guard unit tests
        run: npm run test:staging-guard

      - name: Auth matrix env guard unit tests
        run: npm test -- --runInBand tests/integration/auth-matrix/env-guard.test.ts

      - name: Auth matrix harness unit tests
        run: npm test -- --runInBand scripts/auth-matrix/__tests__

      - name: Verify migration inventory (local filenames only)
        run: npm run check:migrations

      - name: Lint staging shell scripts
        run: |
          bash -n scripts/staging/run-pr58-audits.sh
          bash -n scripts/auth-matrix/reset-environment.sh

      - name: Assert workflow configuration contract (no real ref values)
        run: npx tsx scripts/staging/assert-no-hardcoded-project-refs.ts

  hosted-db-validation:
    needs: static-validation
    if: >-
      ${{ needs.static-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'mjaychoi/HC-Violins-and-Bows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Require hosted-staging secrets
        run: |
          missing=0
          for name in \
            STAGING_SUPABASE_PROJECT_REF \
            STAGING_SUPABASE_URL \
            STAGING_SUPABASE_ANON_KEY \
            STAGING_SUPABASE_SERVICE_ROLE_KEY \
            STAGING_DATABASE_URL \
            STAGING_APP_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required hosted-staging secret mapped to ${name}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure all six STAGING_* secrets on the hosted-staging environment."
            exit 1
          fi

      - name: Require production project-ref configuration
        run: |
          if [ -z "${PRODUCTION_SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing repository/environment variable PRODUCTION_SUPABASE_PROJECT_REF."
            echo "Configure it before hosted staging integration can run (identifier, not a secret)."
            exit 1
          fi

      - name: Deny production project unconditionally
        run: |
          if [ "$STAGING_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Production project ref is not allowed for hosted staging integration."
            exit 1
          fi
          case "$STAGING_SUPABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production Supabase URL detected."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production DATABASE_URL detected."
              exit 1
              ;;
          esac

      - run: npm ci

      - name: Staging environment guard
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Verify migration inventory
        run: npm run check:migrations

      - name: Verify applied migration set
        run: npx tsx scripts/staging/verify-migration-set.ts

      - name: Run hosted SQL audits
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: bash scripts/staging/run-pr58-audits.sh

      - name: Liveness
        run: |
          body="$(curl -fsS "${STAGING_APP_BASE_URL%/}/api/health")"
          echo "$body" | jq -e '.status == "ok"' >/dev/null

      - name: Wait for readiness
        env:
          POSTDEPLOY_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: npm run wait:ready

      - name: Readiness
        run: |
          body="$(curl -fsS --max-time 10 "${STAGING_APP_BASE_URL%/}/api/ready")"
          echo "$body" | jq -e '.status == "ready"' >/dev/null
          echo "$body" | jq -e '.checks.configuration == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.database == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.schema == "ok"' >/dev/null

  postdeploy-synthetic:
    needs: hosted-db-validation
    if: >-
      ${{ needs.hosted-db-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'mjaychoi/HC-Violins-and-Bows' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      POSTDEPLOY_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
      SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Staging environment guard
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Wait for readiness
        run: npm run wait:ready

      - name: Post-deploy synthetic
        run: npm run test:synthetic:postdeploy

  auth-matrix:
    needs: hosted-db-validation
    if: >-
      ${{ needs.hosted-db-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          vars.AUTH_MATRIX_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      AUTH_MATRIX_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      AUTH_MATRIX_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      AUTH_MATRIX_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_MATRIX_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Require cookie-backed harness entrypoint
        run: |
          if [ ! -f scripts/auth-matrix/run-hosted-matrix.ts ]; then
            echo "vars.AUTH_MATRIX_READY=true but scripts/auth-matrix/run-hosted-matrix.ts is missing."
            echo "Merge the cookie-backed harness follow-up before enabling this job."
            exit 1
          fi

      - name: Staging environment guard
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Bootstrap synthetic fixtures and run matrix
        env:
          AUTH_MATRIX_RUNTIME_MANIFEST: ${{ runner.temp }}/hc-auth-matrix-runtime.json
        run: npx tsx scripts/auth-matrix/run-hosted-matrix.ts

      - name: Cleanup synthetic fixtures
        if: always()
        env:
          AUTH_MATRIX_RUNTIME_MANIFEST: ${{ runner.temp }}/hc-auth-matrix-runtime.json
        run: npx tsx scripts/auth-matrix/cleanup-fixtures.ts

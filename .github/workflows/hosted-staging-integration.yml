name: Hosted Staging Integration

on:
  workflow_dispatch:
    inputs:
      migration_rehearsal_mode:
        description: 'Hosted staging migration rehearsal. off = existing validation-only path. inspect = read-only pending-set. apply = mutate after SHA/count/digest/yes confirmation.'
        required: true
        type: choice
        options:
          - off
          - inspect
          - apply
        default: off
      confirmed_sha:
        description: 'Apply only: reviewed commit SHA (must equal the checked-out SHA)'
        required: false
        type: string
      confirmed_pending_migration_count:
        description: 'Apply only: reviewed pending migration count from a fresh inspect'
        required: false
        type: string
      confirmed_pending_migration_digest:
        description: 'Apply only: reviewed pending-set SHA-256 digest from a fresh inspect'
        required: false
        type: string
      staging_mutation_confirmed:
        description: 'Apply only: literal yes required before any staging database mutation'
        required: true
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
  pull_request:
    paths:
      - 'scripts/staging/**'
      - 'scripts/auth-matrix/**'
      - 'scripts/postdeploy/**'
      - 'tests/integration/auth-matrix/**'
      - 'tests/integration/staging/**'
      - '.github/workflows/hosted-staging-integration.yml'

concurrency:
  group: hosted-staging-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  static-validation:
    if: github.repository == 'mjaychoi/HC-Violins-and-Bows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Staging guard unit tests
        run: npm run test:staging-guard

      - name: Auth matrix env guard unit tests
        run: npm test -- --runInBand tests/integration/auth-matrix/env-guard.test.ts

      - name: Auth matrix harness unit tests
        run: npm test -- --runInBand scripts/auth-matrix/__tests__

      - name: Verify migration inventory (local filenames only)
        run: npm run check:migrations

      - name: Lint staging shell scripts
        run: |
          bash -n scripts/staging/run-pr58-audits.sh
          bash -n scripts/staging/install-database-ca.sh
          bash -n scripts/auth-matrix/reset-environment.sh

      - name: Assert workflow configuration contract (no real ref values)
        run: npx tsx scripts/staging/assert-no-hardcoded-project-refs.ts

  hosted-db-validation:
    needs: static-validation
    if: >-
      ${{ needs.static-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'mjaychoi/HC-Violins-and-Bows' &&
          github.event.inputs.migration_rehearsal_mode != 'inspect' &&
          github.event.inputs.migration_rehearsal_mode != 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Require hosted-staging secrets
        env:
          STAGING_DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
        run: |
          missing=0
          for name in \
            STAGING_SUPABASE_PROJECT_REF \
            STAGING_SUPABASE_URL \
            STAGING_SUPABASE_ANON_KEY \
            STAGING_SUPABASE_SERVICE_ROLE_KEY \
            STAGING_DATABASE_URL \
            STAGING_DATABASE_CA_CERT \
            STAGING_APP_BASE_URL
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required hosted-staging secret mapped to ${name}."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the required STAGING_* secrets on the hosted-staging environment."
            exit 1
          fi

      - name: Require production project-ref configuration
        run: |
          if [ -z "${PRODUCTION_SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing repository/environment variable PRODUCTION_SUPABASE_PROJECT_REF."
            echo "Configure it before hosted staging integration can run (identifier, not a secret)."
            exit 1
          fi

      - name: Deny production project unconditionally
        run: |
          if [ "$STAGING_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Production project ref is not allowed for hosted staging integration."
            exit 1
          fi
          case "$STAGING_SUPABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production Supabase URL detected."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production DATABASE_URL detected."
              exit 1
              ;;
          esac

      - run: npm ci

      - name: Staging environment guard
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Verify migration inventory
        run: npm run check:migrations

      - name: Install staging database CA
        env:
          STAGING_DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
        run: bash scripts/staging/install-database-ca.sh

      - name: Verify applied migration set
        run: npx tsx scripts/staging/verify-migration-set.ts

      - name: Run hosted SQL audits
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: bash scripts/staging/run-pr58-audits.sh

      - name: Liveness
        run: |
          body="$(curl -fsS "${STAGING_APP_BASE_URL%/}/api/health")"
          echo "$body" | jq -e '.status == "ok"' >/dev/null

      - name: Wait for readiness
        env:
          POSTDEPLOY_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: npm run wait:ready

      - name: Readiness
        run: |
          body="$(curl -fsS --max-time 10 "${STAGING_APP_BASE_URL%/}/api/ready")"
          echo "$body" | jq -e '.status == "ready"' >/dev/null
          echo "$body" | jq -e '.checks.configuration == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.database == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.schema == "ok"' >/dev/null

  migration-rehearsal:
    needs: static-validation
    if: >-
      ${{ needs.static-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'mjaychoi/HC-Violins-and-Bows' &&
          (github.event.inputs.migration_rehearsal_mode == 'inspect' ||
           github.event.inputs.migration_rehearsal_mode == 'apply') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hosted-staging
    outputs:
      migration_apply_executed: ${{ steps.apply.outputs.executed || 'false' }}
      classification: ${{ steps.evidence.outputs.classification }}
      app_url_present: ${{ steps.app_url.outputs.present || 'false' }}
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Record checked-out SHA
        id: sha
        run: |
          actual_sha="$(git rev-parse HEAD)"
          echo "Checked out SHA: $actual_sha"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

      - name: Require hosted-staging database secrets
        id: require_secrets
        env:
          STAGING_DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
        run: |
          # Database bootstrap only. STAGING_APP_BASE_URL is required later,
          # only by steps and jobs that call the deployed application.
          missing=0
          for name in \
            STAGING_SUPABASE_PROJECT_REF \
            STAGING_SUPABASE_URL \
            STAGING_SUPABASE_ANON_KEY \
            STAGING_SUPABASE_SERVICE_ROLE_KEY \
            STAGING_DATABASE_URL \
            STAGING_DATABASE_CA_CERT
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required hosted-staging database value mapped to ${name}."
              missing=1
            fi
          done
          if [ -z "${PRODUCTION_SUPABASE_PROJECT_REF:-}" ]; then
            echo "Missing PRODUCTION_SUPABASE_PROJECT_REF."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "BLOCKED_MISSING_ENV"
            exit 1
          fi

      - name: Deny production project unconditionally
        run: |
          if [ "$STAGING_SUPABASE_PROJECT_REF" = "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
            echo "Production project ref is not allowed for hosted staging rehearsal."
            exit 1
          fi
          case "$STAGING_SUPABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production Supabase URL detected."
              exit 1
              ;;
          esac
          case "$STAGING_DATABASE_URL" in
            *"$PRODUCTION_SUPABASE_PROJECT_REF"*)
              echo "Production DATABASE_URL detected."
              exit 1
              ;;
          esac

      - name: Record deployed app URL presence
        id: app_url
        run: |
          if [ -n "${STAGING_APP_BASE_URL:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "STAGING_APP_BASE_URL is unset. Database bootstrap continues. Deployed-app HTTP checks stay deferred."
          fi

      - run: npm ci

      - name: Staging environment guard (hosted rehearsal, no local fallback)
        id: rehearsal_guard
        run: npx tsx scripts/staging/env-guard-cli.ts --hosted-rehearsal

      - name: Require STAGING_DATABASE_URL before any probe
        run: npx tsx scripts/staging/assert-rehearsal-gates.ts staging-db-url

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Record Supabase CLI capabilities
        id: cli
        run: |
          echo "--- supabase --version ---"
          version_line="$(supabase --version)"
          echo "$version_line"
          echo "version=$version_line" >> "$GITHUB_OUTPUT"
          echo "--- supabase db push --help (capability check only; not invoked) ---"
          help_output="$(supabase db push --help 2>&1 || true)"
          echo "$help_output"
          for flag in --db-url --include-all --yes; do
            if echo "$help_output" | grep -q -- "$flag"; then
              echo "capability: $flag available"
            else
              echo "capability MISSING: $flag not found in 'supabase db push --help' output"
              exit 1
            fi
          done

      - name: Verify migration inventory
        run: npm run check:migrations

      - name: Install staging database CA
        env:
          STAGING_DATABASE_CA_CERT: ${{ secrets.STAGING_DATABASE_CA_CERT }}
        run: bash scripts/staging/install-database-ca.sh

      - name: Read-only connectivity probe (SELECT 1)
        id: probe
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/production/db-probe.ts probe

      - name: Migration-history read (before mutation)
        id: history
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx tsx scripts/production/db-probe.ts history | tee history.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('history.json', 'utf8'));
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`pending=\${r.pendingMigrationCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`remote=\${r.remoteUniqueVersionCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`local=\${r.localVersionCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`digest=\${r.pendingDigest}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`first=\${r.firstPendingVersion || ''}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`last=\${r.lastPendingVersion || ''}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`remote_only=\${r.remoteOnlyVersionCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`sale_price_pending=\${r.salePriceMigrationPending}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`sale_lifecycle_pending=\${r.saleLifecycleMigrationPending}\n\`);
          "
          rm -f history.json

      - name: Apply confirmation gates (recomputed at runtime)
        id: apply_gates
        if: github.event.inputs.migration_rehearsal_mode == 'apply'
        env:
          CONFIRMED_SHA: ${{ github.event.inputs.confirmed_sha }}
          ACTUAL_SHA: ${{ steps.sha.outputs.sha }}
          CONFIRMED_PENDING_COUNT: ${{ github.event.inputs.confirmed_pending_migration_count }}
          ACTUAL_PENDING_COUNT: ${{ steps.history.outputs.pending }}
          CONFIRMED_PENDING_DIGEST: ${{ github.event.inputs.confirmed_pending_migration_digest }}
          ACTUAL_PENDING_DIGEST: ${{ steps.history.outputs.digest }}
          STAGING_MUTATION_CONFIRMED: ${{ github.event.inputs.staging_mutation_confirmed }}
          REMOTE_ONLY_COUNT: ${{ steps.history.outputs.remote_only }}
        run: |
          npx tsx scripts/staging/assert-rehearsal-gates.ts apply | tee apply-gates.json
          eligible="$(node -e "console.log(String(JSON.parse(require('fs').readFileSync('apply-gates.json','utf8')).eligible))")"
          classification="$(node -e "const r=JSON.parse(require('fs').readFileSync('apply-gates.json','utf8')); console.log(r.classification || '')")"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          rm -f apply-gates.json

      - name: Sale-price pre-deploy audit (conditional, read-only, blocking)
        id: sale_price_audit
        if: steps.history.outputs.sale_price_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/production/run-predeploy-audit.ts scripts/supabase/sale_price_predeploy_audit.sql 9

      - name: Sale-price pre-deploy audit — not applicable
        if: steps.history.outcome == 'success' && steps.history.outputs.sale_price_pending != 'true'
        run: echo "Migration 20260804010000 is not in the pending set; sale-price pre-deploy audit NOT_APPLICABLE."

      - name: Sale-lifecycle pre-deploy audit (conditional, read-only, blocking)
        id: sale_lifecycle_audit
        if: steps.history.outputs.sale_lifecycle_pending == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/production/run-predeploy-audit.ts scripts/supabase/sale_lifecycle_predeploy_audit.sql 10

      - name: Sale-lifecycle pre-deploy audit — not applicable
        if: steps.history.outcome == 'success' && steps.history.outputs.sale_lifecycle_pending != 'true'
        run: echo "Migration 20260804020000 is not in the pending set; sale-lifecycle pre-deploy audit NOT_APPLICABLE."

      - name: Apply Supabase migrations to hosted staging
        id: apply
        if: >-
          github.event.inputs.migration_rehearsal_mode == 'apply' &&
          steps.apply_gates.outputs.eligible == 'true'
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          if [ -z "$STAGING_DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is required; refusing mutation."
            exit 1
          fi
          if [ -z "${DATABASE_CA_CERT_PATH:-}" ]; then
            echo "DATABASE_CA_CERT_PATH is required before hosted staging mutation."
            exit 1
          fi
          # libpq sslmode=require does not verify the CA. Rewrite TLS
          # parameters only; the push command itself stays the same.
          # Do not print the connection string.
          STAGING_DATABASE_URL="$(DATABASE_URL="$STAGING_DATABASE_URL" npx tsx scripts/production/format-libpq-verify-full-url.ts)"
          supabase db push --db-url "$STAGING_DATABASE_URL" --include-all --yes
          echo "executed=true" >> "$GITHUB_OUTPUT"
          echo "result=success" >> "$GITHUB_OUTPUT"

      - name: Post-deploy catalog postflight (authoritative, blocking)
        id: postflight
        if: steps.apply.outputs.executed == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set +e
          npx tsx scripts/production/postflight-catalog.ts | tee postflight.json
          tsx_status="${PIPESTATUS[0]}"
          set -e
          passed="$(node -e "console.log(JSON.parse(require('fs').readFileSync('postflight.json','utf8')).passed)" 2>/dev/null || echo false)"
          rm -f postflight.json
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          if [ "$tsx_status" != "0" ]; then
            echo "Postflight catalog check failed (exit $tsx_status)."
            exit 1
          fi
          if [ "$passed" != "true" ]; then
            echo "Postflight catalog check did not report passed=true."
            exit 1
          fi

      - name: Exact staging migration-set verification
        id: verify_set
        if: steps.apply.outputs.executed == 'true'
        run: npx tsx scripts/staging/verify-migration-set.ts

      - name: Hosted SQL audits
        id: sql_audits
        if: steps.apply.outputs.executed == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: bash scripts/staging/run-pr58-audits.sh

      - name: Liveness
        id: health
        if: steps.apply.outputs.executed == 'true' && steps.app_url.outputs.present == 'true'
        run: |
          if [ -z "${STAGING_APP_BASE_URL:-}" ]; then
            echo "STAGING_APP_BASE_URL missing; cannot collect app-health evidence."
            exit 1
          fi
          body="$(curl -fsS "${STAGING_APP_BASE_URL%/}/api/health")"
          echo "$body" | jq -e '.status == "ok"' >/dev/null

      - name: Wait for readiness
        id: wait_ready
        if: steps.apply.outputs.executed == 'true' && steps.app_url.outputs.present == 'true'
        env:
          POSTDEPLOY_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
        run: npm run wait:ready

      - name: Readiness
        id: ready
        if: steps.apply.outputs.executed == 'true' && steps.app_url.outputs.present == 'true'
        run: |
          body="$(curl -fsS --max-time 10 "${STAGING_APP_BASE_URL%/}/api/ready")"
          echo "$body" | jq -e '.status == "ready"' >/dev/null
          echo "$body" | jq -e '.checks.configuration == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.database == "ok"' >/dev/null
          echo "$body" | jq -e '.checks.schema == "ok"' >/dev/null

      - name: Migration-history read (after mutation)
        id: history_after
        if: steps.apply.outputs.executed == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx tsx scripts/production/db-probe.ts history | tee history-after.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('history-after.json', 'utf8'));
            const fs = require('fs');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`pending=\${r.pendingMigrationCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`remote=\${r.remoteUniqueVersionCount}\n\`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, \`remote_only=\${r.remoteOnlyVersionCount}\n\`);
          "
          rm -f history-after.json

      - name: Write rehearsal evidence
        id: evidence
        if: always()
        env:
          REHEARSAL_SHA: ${{ steps.sha.outputs.sha }}
          REHEARSAL_CLI_VERSION: ${{ steps.cli.outputs.version }}
          REHEARSAL_MODE: ${{ github.event.inputs.migration_rehearsal_mode }}
          REHEARSAL_LOCAL_COUNT: ${{ steps.history.outputs.local }}
          REHEARSAL_REMOTE_BEFORE: ${{ steps.history.outputs.remote }}
          REHEARSAL_PENDING_BEFORE: ${{ steps.history.outputs.pending }}
          REHEARSAL_PENDING_DIGEST: ${{ steps.history.outputs.digest }}
          REHEARSAL_FIRST_PENDING: ${{ steps.history.outputs.first }}
          REHEARSAL_LAST_PENDING: ${{ steps.history.outputs.last }}
          REHEARSAL_REQUIRE_SECRETS_OUTCOME: ${{ steps.require_secrets.outcome }}
          REHEARSAL_GUARD_OUTCOME: ${{ steps.rehearsal_guard.outcome }}
          REHEARSAL_PROBE_OUTCOME: ${{ steps.probe.outcome }}
          REHEARSAL_HISTORY_OUTCOME: ${{ steps.history.outcome }}
          REHEARSAL_SALE_PRICE_PENDING: ${{ steps.history.outputs.sale_price_pending }}
          REHEARSAL_SALE_PRICE_AUDIT_OUTCOME: ${{ steps.sale_price_audit.outcome }}
          REHEARSAL_SALE_LIFECYCLE_PENDING: ${{ steps.history.outputs.sale_lifecycle_pending }}
          REHEARSAL_SALE_LIFECYCLE_AUDIT_OUTCOME: ${{ steps.sale_lifecycle_audit.outcome }}
          REHEARSAL_APPLY_GATES_OUTCOME: ${{ steps.apply_gates.outcome }}
          REHEARSAL_APPLY_GATES_CLASSIFICATION: ${{ steps.apply_gates.outputs.classification }}
          REHEARSAL_APPLY_OUTCOME: ${{ steps.apply.outcome }}
          REHEARSAL_APPLY_EXECUTED: ${{ steps.apply.outputs.executed || 'false' }}
          REHEARSAL_REMOTE_AFTER: ${{ steps.history_after.outputs.remote }}
          REHEARSAL_PENDING_AFTER: ${{ steps.history_after.outputs.pending }}
          REHEARSAL_POSTFLIGHT: ${{ steps.postflight.outcome || 'not_run' }}
          REHEARSAL_POSTFLIGHT_PASSED: ${{ steps.postflight.outputs.passed || 'false' }}
          REHEARSAL_HISTORY_AFTER_OUTCOME: ${{ steps.history_after.outcome }}
          REHEARSAL_MIGRATION_SET: ${{ steps.verify_set.outcome || 'not_run' }}
          REHEARSAL_SQL_AUDITS: ${{ steps.sql_audits.outcome || 'not_run' }}
          REHEARSAL_HEALTH: ${{ steps.health.outcome || 'not_run' }}
          REHEARSAL_READINESS: ${{ steps.ready.outcome || 'not_run' }}
          REHEARSAL_READINESS_WAIT: ${{ steps.wait_ready.outcome || 'not_run' }}
          REHEARSAL_APP_URL_PRESENT: ${{ steps.app_url.outputs.present || 'false' }}
          REHEARSAL_SYNTHETIC: not_run
        run: |
          mode="${{ github.event.inputs.migration_rehearsal_mode }}"
          apply_result="not_run"
          if [ "${{ steps.apply.outputs.executed }}" = "true" ]; then
            apply_result="success"
          elif [ "$mode" = "apply" ] && [ "${{ steps.apply.outcome }}" = "failure" ]; then
            apply_result="failure"
          fi

          # Skipped health/readiness is not a pass. Absence of the app URL
          # leaves HTTP out of scope so database bootstrap can still pass.
          http_failure=false
          if [ "${{ steps.health.outcome }}" = "failure" ] || [ "${{ steps.wait_ready.outcome }}" = "failure" ] || [ "${{ steps.ready.outcome }}" = "failure" ]; then
            http_failure=true
          fi
          http_passed=false
          if [ "${{ steps.app_url.outputs.present }}" = "true" ] && [ "${{ steps.health.outcome }}" = "success" ] && [ "${{ steps.ready.outcome }}" = "success" ]; then
            http_passed=true
          fi
          http_required_and_incomplete=false
          if [ "${{ steps.apply.outputs.executed }}" = "true" ] && [ "${{ steps.app_url.outputs.present }}" = "true" ] && [ "$http_passed" != "true" ]; then
            http_required_and_incomplete=true
          fi

          export REHEARSAL_HTTP_FAILURE="$http_failure"
          export REHEARSAL_HTTP_REQUIRED_INCOMPLETE="$http_required_and_incomplete"
          set +e
          classification="$(npx tsx scripts/staging/assert-rehearsal-gates.ts classify)"
          classify_status=$?
          set -e
          if [ "$classify_status" -ne 0 ] || [ -z "$classification" ]; then
            echo "Could not classify rehearsal outcome; recording FAILED_PREFLIGHT."
            classification="FAILED_PREFLIGHT"
          fi

          export REHEARSAL_FINAL_CLASSIFICATION="$classification"
          export REHEARSAL_APPLY_RESULT="$apply_result"
          npx tsx scripts/staging/write-rehearsal-evidence.ts staging-migration-rehearsal.json
          echo "classification=$classification" >> "$GITHUB_OUTPUT"

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-migration-rehearsal
          path: staging-migration-rehearsal.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Rehearsal summary
        if: always()
        run: |
          {
            echo "### Hosted staging migration rehearsal"
            echo "1. SHA rehearsed: \`${{ steps.sha.outputs.sha }}\`"
            echo "2. Target positively identified as non-production hosted staging: ${{ steps.evidence.outputs.target_identified }}"
            echo "3. Supabase CLI: \`${{ steps.cli.outputs.version }}\`"
            echo "4. Pending before mutation: ${{ steps.history.outputs.pending }} (digest \`${{ steps.history.outputs.digest }}\`; first \`${{ steps.history.outputs.first }}\`; last \`${{ steps.history.outputs.last }}\`)"
            echo "5. Sale-price audit: ${{ steps.evidence.outputs.sale_price_audit }} (NOT_APPLICABLE = migration confirmed not pending; NOT_EVALUATED = history/audit never reached). Sale-lifecycle audit: ${{ steps.evidence.outputs.sale_lifecycle_audit }}."
            echo "6. \`supabase db push\` executed: ${{ steps.apply.outputs.executed || 'false' }} (result ${{ steps.apply.outcome || 'not_run' }})"
            echo "7. Authoritative catalog postflight: ${{ steps.postflight.outputs.passed == 'true' && 'PASS' || steps.postflight.outcome || 'not_run' }}"
            echo "8. Exact migration-set verification: ${{ steps.verify_set.outcome || 'not_run' }}"
            echo "9. Hosted SQL audits: ${{ steps.sql_audits.outcome || 'not_run' }}"
            echo "10. Health / readiness outcomes: ${{ steps.health.outcome || 'not_run' }} / ${{ steps.ready.outcome || 'not_run' }} (deployed app URL present: ${{ steps.app_url.outputs.present || 'false' }})"
            echo "11. Synthetic: separate postdeploy-synthetic job. After apply it runs only when the deployed app URL was present; otherwise that job is skipped and is not a pass."
            echo "12. Production database touched: NO"
            echo ""
            echo "Final classification: \`${{ steps.evidence.outputs.classification }}\`"
            echo "Deployed-app validation: \`${{ steps.evidence.outputs.deployed_app_validation }}\` (not_run, passed, or failed). A skipped health or readiness outcome is not passed."
            echo ""
            echo "REHEARSAL_EXECUTED_PASS means the hosted database apply, catalog postflight, migration-set check, and SQL audits passed."
            echo "It does not mean health, readiness, synthetic, or auth-matrix acceptance."
            echo ""
            echo "This is a hosted non-production pending-migration rehearsal / staging upgrade-path rehearsal."
            echo "It is not a production clone rehearsal unless separate baseline provenance exists."
            echo ""
            echo "Production database touched: NO"
          } >> "$GITHUB_STEP_SUMMARY"

  # Deployed-app job. mode=off still runs after hosted-db-validation, which
  # already fails when STAGING_APP_BASE_URL is missing. After apply, skip
  # when that URL was absent so a database-only bootstrap stays green.
  # A present URL stays required; the job fails closed if the value is empty.
  postdeploy-synthetic:
    needs: [hosted-db-validation, migration-rehearsal]
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          github.repository == 'mjaychoi/HC-Violins-and-Bows' &&
          (
            (needs.hosted-db-validation.result == 'success' &&
             github.event.inputs.migration_rehearsal_mode != 'inspect' &&
             github.event.inputs.migration_rehearsal_mode != 'apply') ||
            (needs.migration-rehearsal.result == 'success' &&
             github.event.inputs.migration_rehearsal_mode == 'apply' &&
             needs.migration-rehearsal.outputs.migration_apply_executed == 'true' &&
             needs.migration-rehearsal.outputs.app_url_present == 'true')
          ) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      POSTDEPLOY_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
      SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deployed application URL
        run: |
          if [ -z "${STAGING_APP_BASE_URL:-}" ]; then
            echo "STAGING_APP_BASE_URL is required before HTTP checks against the deployed staging application."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Classify synthetic credentials
        run: |
          if [ -z "${SYNTHETIC_EMAIL:-}" ] || [ -z "${SYNTHETIC_PASSWORD:-}" ]; then
            echo "Synthetic credentials are not configured on hosted-staging."
            echo "This is not a synthetic pass."
            echo "SYNTHETIC_NOT_CONFIGURED"
            exit 1
          fi

      - name: Staging environment guard
        env:
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Wait for readiness
        run: npm run wait:ready

      - name: Post-deploy synthetic
        run: npm run test:synthetic:postdeploy

  auth-matrix:
    needs: hosted-db-validation
    if: >-
      ${{ needs.hosted-db-validation.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          vars.AUTH_MATRIX_READY == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hosted-staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ vars.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      STAGING_APP_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
      AUTH_MATRIX_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      AUTH_MATRIX_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      AUTH_MATRIX_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_MATRIX_BASE_URL: ${{ secrets.STAGING_APP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deployed application URL
        run: |
          if [ -z "${STAGING_APP_BASE_URL:-}" ]; then
            echo "STAGING_APP_BASE_URL is required before HTTP checks against the deployed staging application."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - run: npm ci

      - name: Require cookie-backed harness entrypoint
        run: |
          if [ ! -f scripts/auth-matrix/run-hosted-matrix.ts ]; then
            echo "vars.AUTH_MATRIX_READY=true but scripts/auth-matrix/run-hosted-matrix.ts is missing."
            echo "Merge the cookie-backed harness follow-up before enabling this job."
            exit 1
          fi

      - name: Staging environment guard
        run: npx tsx scripts/staging/env-guard-cli.ts

      - name: Bootstrap synthetic fixtures and run matrix
        env:
          AUTH_MATRIX_RUNTIME_MANIFEST: ${{ runner.temp }}/hc-auth-matrix-runtime.json
        run: npx tsx scripts/auth-matrix/run-hosted-matrix.ts

      - name: Cleanup synthetic fixtures
        if: always()
        env:
          AUTH_MATRIX_RUNTIME_MANIFEST: ${{ runner.temp }}/hc-auth-matrix-runtime.json
        run: npx tsx scripts/auth-matrix/cleanup-fixtures.ts
